<!DOCTYPE html><html class="dark" lang="en"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>Login - Placement &amp; Study Tracker</title>
<!-- Material Symbols -->
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&amp;family=JetBrains+Mono:wght@100..900&amp;display=swap" rel="stylesheet">
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .material-symbols-outlined.fill {
            font-variation-settings: 'FILL' 1;
        }
    </style>
<!-- Tailwind CSS -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Tailwind Config injected from Style Guidance -->
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "surface-container-high": "#272a31",
                        "secondary": "#a6e6ff",
                        "error-container": "#93000a",
                        "on-tertiary": "#3a3000",
                        "background": "#10131a",
                        "primary": "#e9feff",
                        "primary-fixed-dim": "#00dce5",
                        "surface-variant": "#32353c",
                        "on-primary-fixed": "#002021",
                        "outline": "#849495",
                        "on-tertiary-fixed": "#221b00",
                        "primary-container": "#00f5ff",
                        "surface-dim": "#10131a",
                        "on-primary-fixed-variant": "#004f53",
                        "on-surface": "#e1e2eb",
                        "tertiary-container": "#ffdb3f",
                        "on-error": "#690005",
                        "surface-tint": "#00dce5",
                        "inverse-primary": "#00696e",
                        "surface": "#10131a",
                        "outline-variant": "#3a494a",
                        "secondary-fixed-dim": "#4cd6ff",
                        "surface-container": "#1d2026",
                        "on-secondary-fixed-variant": "#004e60",
                        "on-primary": "#003739",
                        "tertiary-fixed": "#ffe16c",
                        "on-surface-variant": "#b9caca",
                        "on-primary-container": "#006c71",
                        "on-error-container": "#ffdad6",
                        "on-secondary-fixed": "#001f28",
                        "tertiary": "#fff9f0",
                        "primary-fixed": "#63f7ff",
                        "on-secondary-container": "#00566b",
                        "on-tertiary-container": "#736000",
                        "inverse-on-surface": "#2e3037",
                        "surface-container-lowest": "#0b0e14",
                        "secondary-container": "#14d1ff",
                        "on-tertiary-fixed-variant": "#544600",
                        "surface-bright": "#363940",
                        "secondary-fixed": "#b7eaff",
                        "on-secondary": "#003543",
                        "surface-container-highest": "#32353c",
                        "tertiary-fixed-dim": "#e7c427",
                        "inverse-surface": "#e1e2eb",
                        "on-background": "#e1e2eb",
                        "surface-container-low": "#191c22",
                        "error": "#ffb4ab"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "container-max": "1440px",
                        "gutter": "24px",
                        "margin-mobile": "16px",
                        "stack-gap": "12px",
                        "margin-desktop": "40px",
                        "sidebar-width": "240px",
                        "unit": "4px"
                    },
                    "fontFamily": {
                        "body-lg": ["Inter"],
                        "label-caps": ["JetBrains Mono"],
                        "headline-md": ["Inter"],
                        "headline-lg": ["Inter"],
                        "headline-lg-mobile": ["Inter"],
                        "stats-numeric": ["Inter"],
                        "display": ["Inter"],
                        "body-md": ["Inter"]
                    },
                    "fontSize": {
                        "body-lg": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "label-caps": ["12px", { "lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "500" }],
                        "headline-md": ["24px", { "lineHeight": "32px", "fontWeight": "600" }],
                        "headline-lg": ["32px", { "lineHeight": "40px", "letterSpacing": "-0.02em", "fontWeight": "600" }],
                        "headline-lg-mobile": ["24px", { "lineHeight": "32px", "fontWeight": "600" }],
                        "stats-numeric": ["20px", { "lineHeight": "28px", "fontWeight": "600" }],
                        "display": ["48px", { "lineHeight": "56px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "body-md": ["14px", { "lineHeight": "20px", "fontWeight": "400" }]
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-background text-on-background min-h-screen relative flex items-center justify-center font-body-lg antialiased overflow-hidden selection:bg-primary-fixed-dim/30 selection:text-primary">
<!-- Atmospheric Mesh Gradient Background -->
<div class="fixed inset-0 z-0 pointer-events-none opacity-40">
<div class="absolute top-[-20%] left-[-10%] w-[60vw] h-[60vw] rounded-full bg-primary-fixed-dim/20 blur-[120px] mix-blend-screen"></div>
<div class="absolute bottom-[-20%] right-[-10%] w-[50vw] h-[50vw] rounded-full bg-secondary-fixed-dim/20 blur-[100px] mix-blend-screen"></div>
</div>
<!-- Main Content Container -->
<main class="relative z-10 w-full max-w-[440px] px-margin-mobile md:px-0 animate-in fade-in slide-in-from-bottom-4 duration-700">
<!-- Login Card -->
<div class="bg-surface-container rounded-2xl border border-outline-variant/50 p-gutter md:p-8 shadow-2xl shadow-black/50 backdrop-blur-sm flex flex-col gap-8 transition-all duration-300 hover:-translate-y-1 hover:shadow-[0_20px_40px_rgba(0,220,229,0.15)]">
<!-- Header Section -->
<div class="flex flex-col items-center text-center gap-stack-gap">
<!-- Brand Icon -->
<div class="w-12 h-12 rounded-xl bg-surface-container-highest border border-outline-variant/50 flex items-center justify-center mb-2 shadow-inner">
<span class="material-symbols-outlined text-primary-fixed-dim text-[28px] fill">explore</span>
</div>
<h1 class="font-headline-lg-mobile md:font-headline-lg text-headline-lg-mobile md:text-headline-lg text-on-surface">
                    Welcome back
                </h1>
<p class="font-body-md text-body-md text-on-surface-variant">
                    Log in to your command center to continue tracking your placements.
                </p>
</div>
<!-- OAuth Section -->
<button class="w-full flex items-center justify-center gap-3 py-3 px-4 rounded-lg bg-transparent border border-outline-variant text-on-surface hover:border-primary-fixed-dim/50 hover:bg-surface-variant/30 transition-all group font-body-md text-body-md">
<svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24">
<path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"></path>
<path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"></path>
<path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"></path>
<path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"></path>
</svg>
                Continue with Google
            </button>
<!-- Divider -->
<div class="flex items-center gap-4">
<div class="flex-1 h-px bg-outline-variant/40"></div>
<span class="font-label-caps text-label-caps text-outline uppercase tracking-widest">Or</span>
<div class="flex-1 h-px bg-outline-variant/40"></div>
</div>
<!-- Email Form -->
<form class="flex flex-col gap-6" onsubmit="event.preventDefault();">
<div class="flex flex-col gap-stack-gap">
<!-- Email Input -->
<div class="flex flex-col gap-2">
<label class="font-label-caps text-label-caps text-on-surface-variant uppercase ml-1" for="email">Email Address</label>
<div class="relative group">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline group-focus-within:text-primary-fixed-dim transition-colors text-[20px]">mail</span>
<input class="w-full bg-surface-container-lowest border border-outline-variant rounded-lg py-3 pl-10 pr-4 font-body-md text-body-md text-on-surface placeholder:text-outline focus:outline-none focus:border-primary-fixed-dim focus:ring-1 focus:ring-primary-fixed-dim/50 transition-all" id="email" placeholder="student@university.edu" required="" type="email">
</div>
</div>
<!-- Password Input -->
<div class="flex flex-col gap-2">
<div class="flex items-center justify-between ml-1">
<label class="font-label-caps text-label-caps text-on-surface-variant uppercase" for="password">Password</label>
<a class="font-label-caps text-label-caps text-primary-fixed-dim hover:text-primary-fixed transition-colors" href="#">Forgot?</a>
</div>
<div class="relative group">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline group-focus-within:text-primary-fixed-dim transition-colors text-[20px]">lock</span>
<input class="w-full bg-surface-container-lowest border border-outline-variant rounded-lg py-3 pl-10 pr-10 font-body-md text-body-md text-on-surface placeholder:text-outline focus:outline-none focus:border-primary-fixed-dim focus:ring-1 focus:ring-primary-fixed-dim/50 transition-all" id="password" placeholder="••••••••" required="" type="password">
<button class="absolute right-3 top-1/2 -translate-y-1/2 text-outline hover:text-on-surface transition-colors focus:outline-none" type="button">
<span class="material-symbols-outlined text-[20px]">visibility_off</span>
</button>
</div>
</div>
</div>
<!-- Submit Action -->
<button class="w-full py-3 px-4 rounded-lg bg-primary-fixed-dim text-on-primary-fixed font-body-md text-body-md font-semibold hover:bg-primary-fixed transition-colors shadow-[0_0_15px_rgba(0,220,229,0.15)] hover:shadow-[0_0_20px_rgba(0,220,229,0.25)] flex justify-center items-center gap-2 relative overflow-hidden before:absolute before:inset-0 before:-translate-x-full before:animate-[shimmer_2s_infinite] before:bg-gradient-to-r before:from-transparent before:via-white/20 before:to-transparent" type="submit">
                    Log in securely
                    <span class="material-symbols-outlined text-[18px]">arrow_forward</span>
</button>
</form>
</div>
<!-- Footer Link -->
<p class="mt-8 text-center font-body-md text-body-md text-on-surface-variant">
            Don't have an account? 
            <a class="text-primary-fixed-dim font-medium hover:text-primary-fixed transition-colors underline-offset-4 hover:underline" href="#">
                Create an account
            </a>
</p>
</main>


</body></html>
